<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNSTOCK — Bảng lọc cổ phiếu</title>
<!-- CDN: Bootstrap 5 + DataTables 2 (bản tích hợp BS5) + PapaParse. Cần internet lần đầu. -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
<style>
  body { font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace; font-size:13px;
         background:#0d1117; }
  .container-fluid { max-width:1700px; }
  h1 { font-size:18px; } h2 { font-size:15px; color:#58a6ff; margin-top:28px; }
  .meta { color:#8b949e; font-size:12px; }
  table.dataTable { font-size:12.5px; }
  .up { color:#3fb950; } .down { color:#f85149; }
  .badge-margin { background:#f85149; color:#0d1117; font-weight:700;
                  border-radius:4px; padding:1px 6px; font-size:11px; }
  .form-check-label { font-size:12.5px; }
  a { color:#58a6ff; text-decoration:none; }
</style>
</head>
<body>
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center flex-wrap">
    <div>
      <h1 class="mb-1">📋 VNSTOCK — Bảng lọc cổ phiếu</h1>
      <div class="meta" id="meta">đang tải dữ liệu…</div>
    </div>
    <div><a href="index.html">← Trang chính</a> &nbsp;·&nbsp; <a href="signals.html">Tín hiệu nến/SMC</a></div>
  </div>

  <h2>Bảng lọc toàn thị trường (screen_snapshot)</h2>
  <div class="form-check form-switch my-2">
    <input class="form-check-input" type="checkbox" id="cleanOnly">
    <label class="form-check-label" for="cleanOnly">
      Chỉ hiện mã <b>sạch</b> (không dính cờ margin) &amp; GTGD ≥ 3 tỷ/phiên
    </label>
  </div>
  <table id="tblScreen" class="table table-striped table-hover w-100"></table>

  <h2>Độ rộng thị trường theo ngành (market_breadth)</h2>
  <table id="tblBreadth" class="table table-striped table-hover w-100"></table>

  <p class="meta mt-4">Dữ liệu sinh cục bộ bởi pipeline VNSTOCK — trạng thái point-in-time,
     tham khảo cá nhân, không phải khuyến nghị đầu tư.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<!-- Fallback cho chế độ mở file:// (fetch CSV bị CORS chặn) — candle_scan.py sinh file này -->
<script src="data/screener_data.js"></script>
<script>
// Ưu tiên fetch CSV thật (chạy qua http.server / GitHub Pages luôn tươi);
// mở trực tiếp bằng double-click thì rơi về window.SCREEN_ROWS/BREADTH_ROWS trong .js
async function loadCsv(path, globalName) {
  try {
    const r = await fetch(path);
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    return Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true }).data;
  } catch (e) { return window[globalName] || null; }
}
const num = (v, d = 1) => (v === null || v === undefined || v === "" || Number.isNaN(v))
  ? "–" : Number(v).toLocaleString("vi-VN", { maximumFractionDigits: d });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const VI = { search: "Tìm:", info: "Hiện _START_–_END_ / _TOTAL_ dòng",
             lengthMenu: "Hiện _MENU_ dòng", paginate: { next: "›", previous: "‹" },
             zeroRecords: "Không có dòng nào khớp", infoFiltered: "(lọc từ _MAX_ dòng)" };

let screenTable;
(async () => {
  const rows = await loadCsv("screen_snapshot.csv", "SCREEN_ROWS");
  const breadth = await loadCsv("market_breadth.csv", "BREADTH_ROWS");
  if (!rows) {
    document.getElementById("meta").textContent = "Chưa có dữ liệu — chạy vn_indicators.py rồi candle_scan.py";
    return;
  }
  document.getElementById("meta").textContent =
    `${rows.length} mã · phiên ${rows[0]?.date ?? breadth?.[0]?.date ?? "?"} · nguồn: screen_snapshot.csv + market_breadth.csv`;

  const pct = d => v => v === null || v === "" || v === undefined ? "–"
    : `<span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${num(v, d)}</span>`;

  screenTable = new DataTable("#tblScreen", {
    data: rows, language: VI, pageLength: 25, order: [[5, "desc"]],
    scrollX: true,
    columns: [
      { data: "ticker", title: "Mã", render: v => `<b>${esc(v)}</b>` },
      { data: "exchange", title: "Sàn", defaultContent: "–" },
      { data: "industry", title: "Ngành", defaultContent: "–" },
      { data: "close", title: "Giá", render: v => num(v, 0) },
      { data: "chg_today_pct", title: "%Phiên", render: pct(2) },
      { data: "rs_rating", title: "RS", render: v => num(v, 0) },
      { data: "rsi14", title: "RSI", render: v => num(v, 0) },
      { data: "rel_vol", title: "RelVol", render: v => num(v, 2) },
      { data: "gtgd20_ty", title: "GTGD(tỷ)", render: v => num(v, 1) },
      { data: "pct_from_52w_high", title: "%từ đỉnh 52w", render: pct(1) },
      { data: "structure", title: "Cấu trúc", defaultContent: "–" },
      { data: "pe", title: "P/E", render: v => num(v, 1) },
      { data: "pb", title: "P/B", render: v => num(v, 2) },
      { data: "roe", title: "ROE%", render: v => num(v, 1) },
      { data: "foreign_room_pct", title: "Room%", render: v => num(v, 1) },
      { data: "margin_status", title: "Cờ", defaultContent: "",
        render: v => v ? `<span class="badge-margin">${esc(v)}</span>` : "" },
    ],
  });

  // Bộ lọc "mã sạch": margin_status trống + GTGD >= 3 tỷ
  DataTable.ext.search.push((settings, data, idx) => {
    if (settings.nTable.id !== "tblScreen" || !document.getElementById("cleanOnly").checked) return true;
    const row = screenTable.row(idx).data();
    return !row.margin_status && Number(row.gtgd20_ty) >= 3;
  });
  document.getElementById("cleanOnly").addEventListener("change", () => screenTable.draw());

  if (breadth) {
    new DataTable("#tblBreadth", {
      data: breadth, language: VI, paging: false, searching: false, info: false,
      order: [[7, "desc"]],
      columns: [
        { data: "group", title: "Nhóm", render: v => `<b>${esc(v)}</b>` },
        { data: "n_symbols", title: "Số mã" },
        { data: "n_up", title: "Tăng", render: v => `<span class="up">${v}</span>` },
        { data: "n_down", title: "Giảm", render: v => `<span class="down">${v}</span>` },
        { data: "n_flat", title: "Đứng" },
        { data: "pct_above_ma200", title: "%trên MA200", render: v => num(v, 1) },
        { data: "avg_ret_1m", title: "TB 1 tháng %", render: pct(1) },
        { data: "avg_rs_rating", title: "RS TB", render: v => num(v, 1) },
      ],
    });
  }
})();
</script>
</body>
</html>
